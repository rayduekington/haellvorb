[workspace]
resolver = "2"
members = [
    "haellvorb-dsp",
    "haellvorb-plugin",
]
exclude = [
    "target",
    "nice-plug",
]

[workspace.package]
version = "0.3.1"
edition = "2021"

[profile.release]
lto = true
opt-level = 3

[profile.dev]
opt-level = 1

[patch."https://github.com/AlexCharlton/nice-plug"]
nice-plug = { path = "nice-plug/crates/nice-plug" }
nice-plug-egui = { path = "nice-plug/crates/nice-plug-egui" }

[profile.dev.package.haellvorb-dsp]
opt-level = 3
